<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tilda test page</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:20px;max-width:560px;margin-inline:auto}
button,select{font-size:18px;padding:12px;width:100%;margin:8px 0;border-radius:10px;border:1px solid #888}
#rec{background:#0b6;color:#fff;border:0;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}#rec.on{background:#c22}
pre{background:#f3f3f3;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:14px}
.big{font-size:22px;margin:12px 0}
@media(prefers-color-scheme:dark){body{background:#111;color:#eee}pre{background:#222}select{background:#222;color:#eee}}
</style></head><body>
<h2>Tilda test page</h2>
<div id="keynote" style="display:none;background:#fff3cd;color:#664d03;padding:10px;border-radius:8px;margin-bottom:10px"></div>
<p>Say a greeting and the name first, e.g. "Namaskaram Tilda", then speak.</p>
<select id="lang"><option value="auto">Auto (greeting, then detect)</option></select>
<button id="rec">Tap or hold to record</button>
<div class="big" id="text"></div>
<pre id="log">Waiting.</pre>
<script>
const rec=document.getElementById('rec'),logEl=document.getElementById('log'),textEl=document.getElementById('text');
Promise.all([fetch('languages').then(r=>r.json()),fetch('beta').then(r=>r.json())]).then(([l,b])=>l.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c+(b.includes(c)?' (beta)':'');document.getElementById('lang').append(o)}));
fetch('status').then(r=>r.json()).then(s=>{const k=document.getElementById('keynote');if(s.demo){k.style.display='block';k.textContent='Demo mode: answers are sample text. Set SARVAM_API_KEY or GROQ_API_KEY for real voice.'}else if(!s.ready){k.style.display='block';k.textContent='Key not set: add SARVAM_API_KEY or GROQ_API_KEY (see .env.example) to turn on real voice. The app itself is running.'}}).catch(()=>{});
let mr,stream,rot,sess=0,seq=0,timer,t0,downAt=0,starting=false,stopAfterStart=false;
const SEG_MS=8000; // speech is cut into 8 s pieces, each saved on the phone the moment it ends
const HOLD_MS=450; // press longer than this = hold mode (release stops); shorter = tap mode (tap again stops)
rec.addEventListener('contextmenu',e=>e.preventDefault());
function recording(){return mr&&mr.state==='recording'}
function piece(final){
  const r=new MediaRecorder(stream),buf=[];
  r.ondataavailable=e=>buf.push(e.data);
  r.onstop=async()=>{const blob=new Blob(buf);if(blob.size>800){await store('readwrite','add',{blob,lang:document.getElementById('lang').value,sess,seq:seq++});flush()}};
  r.start();return r;
}
async function start(){
  starting=true;stopAfterStart=false;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){starting=false;logEl.textContent='Microphone blocked: allow it in the browser and try again.';return}
  sess=Date.now();seq=0;sessText[sess]='';textEl.textContent='';logEl.textContent='Recording. Pieces are saved on your phone as you speak.';
  mr=piece();t0=Date.now();starting=false;rec.classList.add('on');
  // start the next piece BEFORE ending the current one so no words fall in a gap
  rot=setInterval(()=>{const old=mr;mr=piece();old.stop()},SEG_MS);
  timer=setInterval(()=>{rec.textContent='Recording '+Math.round((Date.now()-t0)/1000)+'s'},250);
  rec.textContent='Recording 0s';
  if(stopAfterStart)stop();
}
function stop(){
  clearInterval(timer);clearInterval(rot);
  if(recording()){mr.stop();stream.getTracks().forEach(t=>t.stop())}
  rec.classList.remove('on');rec.textContent='Tap or hold to record';
}
rec.addEventListener('pointerdown',e=>{
  rec.setPointerCapture(e.pointerId);
  if(recording()){stop();downAt=0;return}   // tap mode: second tap stops
  downAt=Date.now();start();
});
function released(){
  if(!downAt)return;                         // this press only stopped a tap-mode recording
  const held=Date.now()-downAt>=HOLD_MS;
  downAt=0;
  if(!held)return;                           // quick tap: keep recording until the next tap
  if(starting)stopAfterStart=true;else stop();
}
rec.addEventListener('pointerup',released);
rec.addEventListener('pointercancel',released);
// Offline safety: every recording is saved on the phone first. It is removed only after the
// server answers, so a dropped or slow network never loses speech; it retries by itself.
const DB=new Promise((ok,no)=>{const q=indexedDB.open('tilda',1);q.onupgradeneeded=()=>q.result.createObjectStore('q',{autoIncrement:true});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
async function store(mode,...a){const db=await DB;return new Promise((ok,no)=>{const t=db.transaction('q',mode),o=t.objectStore('q');let r;if(a[0]==='add')r=o.add(a[1]);else if(a[0]==='del')r=o.delete(a[1]);else r=o.openCursor();t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})}
async function pending(){const db=await DB;return new Promise(ok=>{const out=[];const c=db.transaction('q').objectStore('q').openCursor();c.onsuccess=()=>{const x=c.result;if(x){out.push({key:x.key,val:x.value});x.continue()}else ok(out)}})}
async function post(blob,lang){
  const f=new FormData();f.append('audio',blob,'a.webm');f.append('lang',lang);
  const r=await fetch('transcribe',{method:'POST',body:f,signal:AbortSignal.timeout(45000)});
  if(!r.ok&&r.status!==502)throw new Error('http '+r.status);
  return r.json();
}
const sessText={},sessLang={};
function show(j,sid){
  if(j.text)sessText[sid]=((sessText[sid]||'')+' '+j.text).trim();
  textEl.textContent=sessText[sid]||'';
  const lines=(j.log||[]).map(x=>x[0]+': '+x[1]);
  logEl.textContent=(j.error?('FAILED: '+j.error+'\n'):('Engine used: '+j.engine+'\nLanguage: '+j.language+'\nGreeting found: '+j.greeting_found+'\nHeard first: '+j.heard_first+'\n'))+(j.action?('\nAction: '+j.action.action+' '+JSON.stringify(j.action.args)+(j.action.needs_yes?' (needs your yes)':'')+'\n'):'')+'\nTried:\n'+lines.join('\n');
}
let flushing=false;
async function flush(){
  if(flushing)return;flushing=true;
  try{for(const {key,val} of (await pending()).sort((x,y)=>x.val.sess-y.val.sess||x.val.seq-y.val.seq)){
    try{
      const lang=(val.lang==='auto'&&sessLang[val.sess])||val.lang;
      const j=await post(val.blob,lang);
      if(j.error)throw new Error(j.error);
      if(j.language&&j.language!=='unknown'&&val.lang==='auto')sessLang[val.sess]=j.language; // keep the greeted language for the rest of the speech
      await store('readwrite','del',key);show(j,val.sess);
    }catch(e){break}
  }}finally{flushing=false}
  const n=(await pending()).length;if(n)logEl.textContent=(recording()?'Recording. ':'')+'No network: '+n+' piece(s) saved on your phone, text will appear when it returns.';
}
addEventListener('online',flush);setInterval(flush,10000);flush();
</script></body></html>
