name: build-apps
on:
  push:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install flask requests pytest
      - run: PYTHONPATH=. python -m pytest -q
        working-directory: backend

  docker-compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start with one command and no keys, like the judges will
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 3; done
          curl -sf http://localhost:8000/ | grep -q "Tilda test page"
          curl -sf http://localhost:8000/status
          docker compose down

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Create platform folders
        working-directory: app
        run: flutter create --platforms=android .
      - name: Permissions, minSdk, plain http for the demo
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.media.action.IMAGE_CAPTURE"/></intent></queries><application android:usesCleartextTraffic="true"#' $M
          sed -i 's#</application>#<service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="voice dictation bubble"/></service></application>#' $M
          sed -i -E 's/minSdk(Version)?[ ]*=?[ ]*flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle* || true
          grep -nE "minSdk" android/app/build.gradle*
      - name: Add the typing service (Kotlin) to the Android project
        working-directory: app
        run: bash native/inject.sh
      - run: flutter pub get
        working-directory: app
      - name: Use the same signing key every build so updates install over the old app
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
        working-directory: app
      - name: Unit tests for the call-words
        run: flutter test test/callwords_test.dart
        working-directory: app
      - name: Let the screen fill the camera hole and rounded corners
        run: |
          for f in $(find android/app/src -name styles.xml); do
            sed -i 's#\(<style name="\(Launch\|Normal\)Theme"[^>]*>\)#\1\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$f"
          done
        working-directory: app
      - name: Add the offline text-reading models (Hindi script plus the other three the plugin expects)
        run: |
          F=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          printf '\ndependencies {\n    implementation("com.google.mlkit:text-recognition-chinese:16.0.1")\n    implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")\n    implementation("com.google.mlkit:text-recognition-japanese:16.0.1")\n    implementation("com.google.mlkit:text-recognition-korean:16.0.1")\n}\n' >> "$F"
        working-directory: app
      - name: Skip the release lint check (it crashes inside the camera plugin)
        run: |
          mkdir -p ~/.gradle/init.d
          printf 'allprojects { tasks.configureEach { t -> if (t.name.startsWith("lintVital") || t.name.startsWith("lintAnalyze")) t.enabled = false } }\n' > ~/.gradle/init.d/nolint.gradle
      - name: Set the minimum Android version to 6 right before building
        run: |
          sed -i -E 's/minSdk(Version)?[ ]*=?[ ]*flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle*
          grep -nE "minSdk" android/app/build.gradle*
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - name: Which library needs Android 7
        run: |
          R=app/build/app/outputs/logs/manifest-merger-release-report.txt; ls "$R"
          sed -n '280,330p' "$R"
      - uses: actions/upload-artifact@v4
        with: { name: tilda-android-apk, path: app/build/app/outputs/flutter-apk/app-release.apk }

  emulator:
    # Installs the finished app on virtual phones with old, middle and new Android, opens it, and checks it stays alive.
    # Informational: it does not stop a release, because a virtual phone is not a real one.
    needs: [android]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api: [23, 26, 29, 33, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: tilda-android-apk, path: out }
      - name: Which phone types the app carries code for
        run: unzip -l out/app-release.apk | grep -o 'lib/[a-z0-9_-]*/' | sort | uniq -c
      - name: Allow the virtual phone to run fast
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash scripts/smoke.sh out/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=windows .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with: { name: tilda-windows, path: app/build/windows/x64/runner/Release }

  release:
    # Every green build on main replaces the "latest" release, so the download link never changes.
    if: github.ref == 'refs/heads/main'
    needs: [backend-tests, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: tilda-android-apk, path: out }
      - uses: actions/download-artifact@v4
        with: { name: tilda-windows, path: win }
      - name: Publish latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/app-release.apk out/tilaya-tilvi.apk
          (cd win && zip -qr ../out/tilaya-tilvi-windows.zip .)
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest out/tilaya-tilvi.apk out/tilaya-tilvi-windows.zip \
            --repo "$GITHUB_REPOSITORY" --title "Latest build" \
            --notes "Newest build from main. Updated automatically ($GITHUB_SHA)."
