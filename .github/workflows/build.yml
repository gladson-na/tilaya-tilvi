name: build-apps
on:
  push:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install flask requests pytest
      - run: PYTHONPATH=. python -m pytest -q
        working-directory: backend

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Create platform folders
        working-directory: app
        run: flutter create --platforms=android .
      - name: Permissions, minSdk, plain http for the demo
        working-directory: app
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries><application android:usesCleartextTraffic="true"#' $M
          sed -i 's#</application>#<service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="voice dictation bubble"/></service></application>#' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
      - name: Add the typing service (Kotlin) to the Android project
        working-directory: app
        run: bash native/inject.sh
      - run: flutter pub get
        working-directory: app
      - name: Use the same signing key every build so updates install over the old app
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
        working-directory: app
      - run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with: { name: tilda-android-apk, path: app/build/app/outputs/flutter-apk/app-release.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter create --platforms=windows .
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with: { name: tilda-windows, path: app/build/windows/x64/runner/Release }

  release:
    # Every green build on main replaces the "latest" release, so the download link never changes.
    if: github.ref == 'refs/heads/main'
    needs: [backend-tests, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: tilda-android-apk, path: out }
      - uses: actions/download-artifact@v4
        with: { name: tilda-windows, path: win }
      - name: Publish latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv out/app-release.apk out/tilaya-tilvi.apk
          (cd win && zip -qr ../out/tilaya-tilvi-windows.zip .)
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest out/tilaya-tilvi.apk out/tilaya-tilvi-windows.zip \
            --repo "$GITHUB_REPOSITORY" --title "Latest build" \
            --notes "Newest build from main. Updated automatically ($GITHUB_SHA)."
