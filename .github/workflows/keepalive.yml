name: keep-server-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the free Render server so the first request is never slow
        run: curl -fsS --max-time 90 --retry 2 https://tilda-backend-opfj.onrender.com/health
